<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Berco Cafe</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo-circle">
                ☕
            </div>
            <h1>BERCO CAFE</h1>
            <p>Sistem Pemesanan Online</p>
        </div>

        <div class="alert-warning">
            Kami sudah tutup. Buka kembali besok pukul 16.00 WIB
        </div>

        <div class="login-card">
            <h2>Selamat Datang</h2>
            <p class="subtitle">Login atau daftar untuk mulai memesan</p>

            <div class="login-toggle">
    <button class="active">Login</button>
    <button onclick="window.location.href='daftar.html'">Daftar</button>
</div>

            <form>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="******">
                </div>
               <button type="button" onclick="window.location.href='menu.html'" class="btn-login-submit">Login</button>
            </form>

            <div class="divider"><span>Atau</span></div>

            <button class="btn-guest">
                <i class="far fa-user-circle"></i> Lanjutkan sebagai Guest
            </button>
            <p class="guest-note">Mode guest memungkinkan Anda memesan tanpa akun</p>
        </div>

        <a href="index.html" class="back-link">Kembali ke Beranda</a>
    </div>

</body>
</html>
