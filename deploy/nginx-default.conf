server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 40M;

    # Redirect path trailing slash / index
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset statis caching lama
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|webp|woff2?|eot|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Blokir akses ke file tersembunyi (kecuali Let's Encrypt well-known bila dipakai di container)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\. {
        deny all;
    }
}