# Cafe Berco — reverse proxy Nginx host (untuk akses dari internet)
#
# Pasang: sudo cp deploy/nginx-online.conf /etc/nginx/sites-available/berco
#         sudo ln -s /etc/nginx/sites-available/berco /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# Lalu dapatkan sertifikat: sudo certbot --nginx -d berco.example.com
#
# Ganti `berco.example.com` dengan domain yang sudah diarahkan (A record / tunnel)
# ke server Anda. Aplikasi mendengarkan di 127.0.0.1:8080 (podman).

server {
    listen 80;
    server_name berco.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Batasi ukuran upload (foto menu, logo kopi) sampai yang diperbolehkan app.
    client_max_body_size 25m;
}

# Blok HTTPS di bawah dibuat otomatis oleh `certbot --nginx`.
# Setelah menjalankan certbot, server_name + proxy di atas otomatis disalin ke blok 443.